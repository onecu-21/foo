name: Nightly

# Every day at 01:30 KST (16:30 UTC) build main and, if it passes the full CI,
# overwrite the rolling `nightly` prerelease. Skipped when main has not changed
# since the last nightly. Run it by hand with "Run workflow" to force a build.
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$last" != "$(git rev-parse HEAD)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last nightly ($last); skipping."
          fi

  ci:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: foo-*
          path: dist
      - name: Package binaries
        run: |
          mkdir -p out stage
          for dir in dist/foo-*; do
            target=${dir#dist/foo-}
            name="foo-nightly-$target"
            mkdir -p "stage/$name"
            cp LICENSE README.md "stage/$name/"
            if [ -f "$dir/foo.exe" ]; then
              cp "$dir/foo.exe" "stage/$name/"
              (cd stage && zip -qr "../out/$name.zip" "$name")
            else
              cp "$dir/foo" "stage/$name/"
              chmod +x "stage/$name/foo"
              tar -czf "out/$name.tar.gz" -C stage "$name"
            fi
          done
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
      - name: Overwrite the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Unreleased build of \`main\` at ${GITHUB_SHA} ($(date -u +'%Y-%m-%d %H:%M UTC')). It replaces the previous nightly every time, so older nightlies are not kept. For a stable build, use the latest numbered release."
            echo
            echo "- Every binary was built by CI, and this is only published when all CI jobs pass."
            echo "- Linux powerpc64, powerpc64le, riscv64, s390x, ARMv7, PowerPC32, and SPARC64 are built and unit-tested under QEMU only. MIPS32 and MIPS64 (big- and little-endian) are experimental: Rust tier 3, built from source on nightly and unit-tested under QEMU."
            echo "- macOS on Apple silicon is not built or tested in CI. I think it'll work.... maybe? Build from source there with \`cargo install --path . --locked\`."
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
          } > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/* \
            --title "Nightly" \
            --notes-file notes.md \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"
