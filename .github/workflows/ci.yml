name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when this runs via workflow_call, so a
  # nightly or release run never cancels the push/PR run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Platform coverage
#
# Native runners (clippy, full tests, release build):
#   Linux    x64, x86, arm64
#   Windows  x64, x86, arm64
#   macOS    x64 only. Apple silicon (aarch64-apple-darwin) is deliberately not built
#            or tested here, so it is unverified.
#
# Emulated with QEMU (release build and unit tests only, see below):
#   Linux    powerpc64 (big-endian), powerpc64le, riscv64        (cross)
#   Linux    s390x, ARM32 (armv7 hard-float), PowerPC32, SPARC64        (apt cross gcc)
#   Linux    LoongArch64 (static musl, linked with clang + lld)
#   Linux    MIPS32 BE/LE, MIPS64 BE/LE, m68k                    (apt cross gcc,
#            Rust tier 3: nightly + build-std, so "experimental": a failure here
#            does not fail CI, and a binary is only published if it fully passed)
#
# Not built, because there is no usable toolchain:
#   riscv32 (no glibc port and no tier 1/2 Rust target),
#   SPARC32 (no packaged glibc cross toolchain), Hexagon (needs Qualcomm's toolchain),
#   x86 / powerpc / riscv on macOS, powerpc / riscv on Windows.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cobol: true }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, multilib: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit C toolchain
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # GnuCOBOL lets the COBOL integration test really run here; FOO_REQUIRE_COBOL
      # turns "cobc not found, skip" into a failure.
      - name: Install GnuCOBOL
        if: matrix.cobol
        run: |
          sudo apt-get update && sudo apt-get install -y gnucobol
          cobc --version | head -1
          echo "FOO_REQUIRE_COBOL=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      # The integration tests compile a real Rust solution with the host rustc,
      # so they need a working native toolchain; that is why they run here.
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: foo-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/foo
            target/${{ matrix.target }}/release/foo.exe
          if-no-files-found: error

  emulated:
    name: ${{ matrix.target }} (QEMU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - powerpc64-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # Only the unit tests (`--bin foo`) run under QEMU: the integration tests in
      # tests/cli.rs need a rustc for the target inside the emulated environment.
      - name: Unit tests
        run: cross test --locked --bin foo --target ${{ matrix.target }}
      - name: Build release binary
        run: cross build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: foo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/foo
          if-no-files-found: error

  # Same idea as `emulated`, without `cross`: cross's latest release predates the
  # LoongArch and m68k images, so use Ubuntu's cross gcc, glibc sysroot, and qemu-user.
  qemu:
    name: ${{ matrix.target }} (QEMU${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: s390x-unknown-linux-gnu, gcc: s390x-linux-gnu, qemu: s390x, experimental: false }
          - { target: armv7-unknown-linux-gnueabihf, gcc: arm-linux-gnueabihf, qemu: arm, experimental: false }
          - { target: powerpc-unknown-linux-gnu, gcc: powerpc-linux-gnu, qemu: ppc, experimental: false }
          - { target: loongarch64-unknown-linux-musl, qemu: loongarch64, linker: clang, apt: "clang lld", rustflags: "-C link-arg=--target=loongarch64-unknown-linux-musl -C link-arg=-fuse-ld=lld", experimental: false }
          - { target: sparc64-unknown-linux-gnu, gcc: sparc64-linux-gnu, qemu: sparc64, experimental: false }
          - { target: mips-unknown-linux-gnu, gcc: mips-linux-gnu, qemu: mips, experimental: true }
          - { target: mipsel-unknown-linux-gnu, gcc: mipsel-linux-gnu, qemu: mipsel, experimental: true }
          - { target: mips64-unknown-linux-gnuabi64, gcc: mips64-linux-gnuabi64, qemu: mips64, experimental: true }
          - { target: mips64el-unknown-linux-gnuabi64, gcc: mips64el-linux-gnuabi64, qemu: mips64el, experimental: true }
          - { target: m68k-unknown-linux-gnu, gcc: m68k-linux-gnu, qemu: m68k, rustflags: "-C relocation-model=static -C link-arg=-no-pie -C target-cpu=M68040", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and QEMU
        run: |
          pkgs="qemu-user ${{ matrix.apt }}"
          if [ -n "${{ matrix.gcc }}" ]; then pkgs="$pkgs gcc-${{ matrix.gcc }}"; fi
          sudo apt-get update && sudo apt-get install -y $pkgs
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.experimental }}
        with:
          targets: ${{ matrix.target }}
      # Tier 3 targets ship no prebuilt std, so build it from source on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ matrix.experimental }}
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Point cargo at the cross linker and QEMU
        run: |
          upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          if [ -n "${{ matrix.gcc }}" ]; then
            # glibc target: Ubuntu's cross gcc, and its sysroot for qemu-user
            echo "CARGO_TARGET_${upper}_LINKER=${{ matrix.gcc }}-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_${upper}_RUNNER=qemu-${{ matrix.qemu }} -L /usr/${{ matrix.gcc }}" >> "$GITHUB_ENV"
          else
            # static musl target: Rust bundles libc, so no sysroot is needed
            echo "CARGO_TARGET_${upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_${upper}_RUNNER=qemu-${{ matrix.qemu }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ matrix.rustflags }}" ]; then
            echo "CARGO_TARGET_${upper}_RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.experimental }}" = true ]; then
            echo "CARGO_UNSTABLE_BUILD_STD=std" >> "$GITHUB_ENV"
          fi
      # Only the unit tests (`--bin foo`) run under QEMU: the integration tests in
      # tests/cli.rs need a rustc for the target.
      - name: Unit tests
        run: cargo test --locked --bin foo --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: foo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/foo
          if-no-files-found: error
